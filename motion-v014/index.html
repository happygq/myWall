<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<title>远行客 · V0.14 微光星空、关系间距</title>
<style>
:root{color-scheme:dark;--ink:#030711;--soft:#93a3b9;--white:#e3e8f1}
*{box-sizing:border-box}html,body{padding:0;margin:0;min-height:100%;background:var(--ink);color:var(--white);font-family:"Yuanti SC","STYuanti","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","PingFang SC",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;padding:8px 12px max(16px,env(safe-area-inset-bottom))}
.screen{position:relative;aspect-ratio:440/858;width:min(96vw,calc((100svh - 170px)*.51282),520px);max-width:100%;overflow:hidden;background:#040b16;flex-shrink:0;touch-action:pan-y}
canvas{display:block;width:100%;height:100%}
#fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#050a14;color:#e4bfb7;font-size:14px;line-height:1.8;padding:20px}
.controls{width:min(96vw,520px);display:flex;flex-direction:column;gap:9px;margin-bottom:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:7px}
button{border:1px solid #2a354a;border-radius:8px;color:#cbd7e9;background:#111a2a;padding:8px 12px;min-height:39px;font-size:13px;cursor:pointer;touch-action:manipulation}
button:active{background:#223247}button.primary{background:#b9cadf;color:#07101e;border-color:#b9cadf;font-weight:600}
.time{font-size:14px;font-variant-numeric:tabular-nums;color:#d6b67f;white-space:nowrap;min-width:66px;text-align:right}
input[type=range]{width:100%;margin:0;accent-color:#b8c8e1;cursor:pointer;touch-action:pan-y;height:18px}
.helper{display:flex;justify-content:space-between;color:#8190a6;font-size:10px;gap:10px;line-height:1.5}
 .helper span:last-child{text-align:right}
.design-choices{display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#9aabc0;font-size:11px}
.design-choices label{white-space:nowrap}.design-choices select{min-height:32px;border-radius:6px;border:1px solid #253044;color:#d6dce6;background:#111a29;font-size:11px;padding:4px;flex:1;min-width:104px}
.jump{min-height:28px;padding:3px 10px;color:#9eb8d3;font-size:11px;background:#0a1423;border:1px solid #1c2c41}
@media (max-height:690px){.screen{width:min(86vw,calc((100svh - 143px)*.51282),480px)}body{gap:5px}.controls{gap:5px}button{min-height:34px}}
@media (min-width:870px){body{padding:14px 20px;gap:12px}.screen{width:min(500px,calc((100svh - 160px)*.51282))}}

/* Event lab remains outside the fixed-ratio artwork. It never covers the life-lines. */
.event-lab{width:min(96vw,520px);border:1px solid #263247;background:#08101c;border-radius:11px;padding:0 12px 13px;margin-top:3px;margin-bottom:32px}
.event-lab summary{cursor:pointer;list-style:none;padding:13px 0;font-size:13px;color:#e0e5ee;display:flex;gap:8px;align-items:center;justify-content:space-between}
.event-lab summary::-webkit-details-marker{display:none}
.event-lab summary::after{content:'⌄';font-size:18px;color:#899ab2}
.event-lab[open] summary::after{content:'⌃'}
.panel-note{font-size:11px;color:#9ba9be;line-height:1.65;margin:0 0 12px}
.event-grid{display:grid;gap:11px}
.event-row{display:grid;grid-template-columns:65px 1fr 55px 48px;gap:10px;align-items:center;font-size:12px;color:#cdd4e1}
.event-row input{width:100%;min-width:0;accent-color:#d4bd8f;touch-action:pan-y}
.event-row output{text-align:right;font-variant-numeric:tabular-nums;color:#d9c29a}
.event-row button{font-size:11px;min-height:30px;padding:4px 5px}
.preset-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.preset-bar button{font-size:11px;min-height:32px;padding:6px 8px}
#eventSummary{font-size:11px;color:#95a8c1;margin:10px 0 0}
.music-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid #243041;flex-wrap:wrap}
.music-row button{color:#f1e4cf;border-color:#5b544b;background:#222329}
.music-row span{flex:1;font-size:11px;line-height:1.5;color:#a9b6c8}
#noteBanner{font-size:11px;color:#d9b792;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<div class="screen" id="screen">
 <canvas id="scene" role="img" aria-label="人生旅程动画：人物光点沿共同年龄线同行，朋友从两侧飞入并离开，亲人升入天空化作星星。"></canvas>
 <div id="fallback">正在准备动画…<small style="font-size:11px;color:#8ca0b6">如持续显示，请使用 Safari / Chrome 打开网页链接。</small></div>
</div>
<div class="controls">
 <div class="toolbar"><button id="play" class="primary" type="button">暂停</button><button id="replay" type="button">↺ 重播</button><button id="rate" type="button">速度 1×</button><button id="full" type="button">全屏</button><span class="time"><b id="age">0.0</b><span id="ageUnit"> 岁</span></span></div>
 <input id="seek" type="range" min="0" max="99" step="0.05" value="0" aria-label="拖动以选择主人公年龄">
 <div class="helper"><button id="finale" class="jump" type="button">↳ 直接看结尾</button><button id="lang" class="jump" type="button" aria-label="切换中英文">English</button><span id="hint">圆体 · 缓离升星 · 低对比星空</span></div>
 <div class="design-choices"><label for="names">人物称谓</label><select id="names" aria-label="选择中文人物称谓">
<option value="warm">亲切日常（推荐）</option><option value="poetic">克制诗意</option><option value="online">轻网络感</option></select>
<label for="type">末尾版式</label><select id="type" aria-label="选择远行客结尾排版">
<option value="cinema">A · 电影字卡</option><option value="book">B · 现代书页</option><option value="vertical">C · 竖排诗笺</option><option value="minimal">D · 极简留白</option></select></div>
</div>
<details class="event-lab" id="eventLab" open>
 <summary><strong>人物升星时间 · 参数实验室</strong><small style="color:#90a0ba">6 人可调</small></summary>
 <p class="panel-note">横轴没有六人的实际年龄；下列数值均表示<strong>“我”的年龄</strong>。拖动后即刻更新轨迹与星座成形时间；每人升星前约 2.5 岁开始横向缓离（仍在同行年龄线），随后停线并慢升。可点击「预览」从准备阶段观看。</p>
 <div id="eventRows" class="event-grid"></div>
 <div class="preset-bar"><button id="presetOriginal" type="button">原设定</button><button id="presetLater" type="button">晚年相伴 · 示例</button><button id="presetStagger" type="button">错峰聚散 · 示例</button><button id="copyConfig" type="button">复制参数 JSON</button></div>
 <div id="eventSummary"></div>
 <div class="music-row"><button id="music" type="button">♫ 开启配乐试听</button><span>原创配乐 V0.13：D 大调五声音阶钢琴动机、渐变弦乐层次；“我”成星后弦乐舒展，最终 A4 长音衰减。手动开启试听。</span></div>
 <div id="noteBanner" aria-live="polite"></div>
</details>
<script>
(()=>{'use strict';
const W=440,H=858,Y=534,APY=33.0,TWO=Math.PI*2;
let END=99;
const CHRONOLOGICAL_PLAY_RATE=.82; // age units per wall-clock second; 99/.82 ~= 121 seconds
const DEPARTURE_LAG=.55,ASCENT_DURATION=5.45;
// A quiet same-time-line pre-departure before the configured ascension age.
// Prep is not an additional death event and does not change any event dates.
const PREP_DURATION=2.5;
const PREP_OFFSETS={gp:24,gm:-23,dad:30,mom:-29,wife:-39,me:-14};
let CONSTELLATION_START=90.9,SON_FLIGHT_START=90.0; const ME_EXIT=84.1;
const cv=document.getElementById('scene'),ctx=cv.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
const cols={me:'#dec98b',mom:'#d9a6ad',dad:'#a6bed7',gm:'#b7a9c9',gp:'#d1d8e0',wife:'#d8b0c9',son:'#9fcbc5',friend:'#a4c1c5',school:'#b4b5ca',love:'#cca4b5',high:'#c4cad1',college:'#d5c3a4',coworker:'#c8c8ae'};
const people=[
 {id:'gm',name:'Grandma',c:cols.gm,base:74,start:0,death:25,star:[80,113]},
 {id:'mom',name:'Mom',c:cols.mom,base:132,start:0,death:68,star:[115,235]},
 {id:'me',name:'Me',c:cols.me,base:230,start:0,death:ME_EXIT,star:[221,342]},
 {id:'dad',name:'Dad',c:cols.dad,base:326,start:0,death:48,star:[326,180]},
 {id:'gp',name:'Grandpa',c:cols.gp,base:392,start:0,death:21,star:[389,86]},
 {id:'school',name:'Grade school friend',c:cols.school,start:6.1,side:'left',target:191,enterDuration:2.1,exit:10.2,exitDuration:2.7,exitSide:'right',labelY:-46},
 {id:'friend',name:'Childhood friend',c:cols.friend,start:5.0,side:'right',target:278,enterDuration:2.8,exit:30.2,exitDuration:2.8,exitSide:'right',labelY:-49},
 {id:'love',name:'First love',c:cols.love,start:15.1,side:'left',target:188,enterDuration:1.3,exit:19.4,exitDuration:3.0,exitSide:'left',labelY:24},
 {id:'high',name:'High school friend',c:cols.high,start:15.5,side:'right',target:253,enterDuration:1.8,exit:20.3,exitDuration:2.4,exitSide:'right',labelY:24},
 {id:'college',name:'College friend',c:cols.college,start:20.4,side:'right',target:190,enterDuration:2.1,exit:25.6,exitDuration:3.3,exitSide:'left',labelY:22},
 {id:'coworker',name:'Coworker',c:cols.coworker,start:23.8,side:'left',target:163,enterDuration:2.5,exit:31.3,exitDuration:2.2,exitSide:'right',labelY:22},
 {id:'wife',name:'Wife',c:cols.wife,start:26.4,side:'left',target:201,enterDuration:1.7,death:75,star:[181,287]},
 {id:'son',name:'Son',c:cols.son,start:34.7,birth:true,death:null,labelY:-49}
];
// All names can be switched without changing motion or chronology.
// Three tested naming registers: all share identical movement and event data.
const NAME_SETS={
 poetic:{gm:'外婆',mom:'母亲',me:'我',dad:'父亲',gp:'爷爷',school:'小学同窗',friend:'发小',love:'初恋',high:'高中同窗',college:'大学同窗',coworker:'同事',wife:'伴侣',son:'孩子'},
 warm:{gm:'外婆',mom:'妈',me:'我',dad:'爸',gp:'爷爷',school:'同桌',friend:'发小',love:'初恋',high:'高中同窗',college:'大学同窗',coworker:'同事',wife:'另一半',son:'孩子'},
 online:{gm:'外婆',mom:'老妈',me:'我',dad:'老爸',gp:'爷爷',school:'同桌',friend:'发小',love:'心动的人',high:'老同学',college:'大学搭子',coworker:'工位搭子',wife:'人生队友',son:'小朋友'}
};
// Fixed layout B coordinates, unchanged from V0.8.
const STAR_LAYOUT={gm:[95,126],mom:[154,197],wife:[176,304],me:[250,362],dad:[292,218],gp:[371,112]};
for (const p of people) if(STAR_LAYOUT[p.id])p.star=STAR_LAYOUT[p.id].slice();
let nameStyle='warm',typography='cinema';
const END_COPY={title:'远行客',quote:'人生天地间，忽如远行客。',closing:'相逢曾同路，星光伴远行。'};
let lang='zh';
const displayName=p=>lang==='zh'?NAME_SETS[nameStyle][p.id]:p.name;
let age=0,playing=true,last=0,lastFrame=0,speed=1,dragging=false;
// Design-lab configuration: every death remains a parameter until frozen by the editor.
const DEATH_CONFIG=[
 {id:'gp',label:'爷爷',min:12,max:67},
 {id:'gm',label:'外婆',min:12,max:70},
 {id:'dad',label:'爸',min:38,max:83},
 {id:'mom',label:'妈',min:42,max:90},
 {id:'wife',label:'伴侣',min:51,max:94},
 {id:'me',label:'我',min:70,max:94}
];
const DEATH_PRESETS={
 original:{gp:21,gm:25,dad:48,mom:68,wife:75,me:84.1},
 later:{gp:29,gm:34,dad:62,mom:77,wife:82,me:86},
 stagger:{gp:24,gm:38,dad:56,mom:79,wife:83,me:89}
};
const DEATH_STORE='renjian-death-lab-v011';
function deathMap(){return Object.fromEntries(DEATH_CONFIG.map(c=>[c.id,people.find(p=>p.id===c.id).death]));}
function refreshTimeline(){
 const lastDeath=Math.max(...DEATH_CONFIG.map(c=>people.find(p=>p.id===c.id).death));
 CONSTELLATION_START=lastDeath+DEPARTURE_LAG+ASCENT_DURATION+.8;
 SON_FLIGHT_START=CONSTELLATION_START-.9;
 END=CONSTELLATION_START+11.6; // extra quiet seconds for the sustained ending tone
 $('seek').max=END.toFixed(2); age=Math.min(age,END);
 $('eventSummary').textContent=`最后一颗亲人星于 ${ (lastDeath+DEPARTURE_LAG+ASCENT_DURATION).toFixed(1) } 个叙事年龄单位成形 · 星座开始于 ${CONSTELLATION_START.toFixed(1)} · 自动延长结尾至 ${END.toFixed(1)}（仅为电影时间，不代表寿命）。`;
}
function applyDeaths(map,{persist=true}={}){
 for(const c of DEATH_CONFIG){
   const n=Number(map[c.id]);
   if(Number.isFinite(n))people.find(p=>p.id===c.id).death=Math.min(c.max,Math.max(c.min,Math.round(n*10)/10));
 }
 refreshTimeline();
 musicFinalTriggered=false;
 for(const c of DEATH_CONFIG){const val=people.find(p=>p.id===c.id).death;$("death_"+c.id).value=val;$("deathVal_"+c.id).textContent=val.toFixed(1);}
 if(persist)try{localStorage.setItem(DEATH_STORE,JSON.stringify(deathMap()));}catch(e){}
 render(age);
}
function setupDeathEditor(){
 const rows=$('eventRows');
 for(const c of DEATH_CONFIG){
  const row=document.createElement('div');row.className='event-row';
  const label=document.createElement('label');label.textContent=c.label;label.htmlFor='death_'+c.id;
  const range=document.createElement('input');range.type='range';range.id='death_'+c.id;range.min=c.min;range.max=c.max;range.step='0.1';range.value=people.find(p=>p.id===c.id).death;
  const output=document.createElement('output');output.id='deathVal_'+c.id;output.htmlFor=range.id;output.textContent=Number(range.value).toFixed(1);
  const jump=document.createElement('button');jump.type='button';jump.textContent='预览';jump.setAttribute('aria-label','预览'+c.label+'升星');
  range.addEventListener('input',()=>{const values=deathMap();values[c.id]=Number(range.value);applyDeaths(values);});
  jump.addEventListener('click',()=>{age=Math.max(0,people.find(p=>p.id===c.id).death-PREP_DURATION-.8);playing=true;last=0;render(age);sync();$('noteBanner').textContent='正在观看：'+c.label+'的准备远离、停线与缓慢升星';});
  row.append(label,range,output,jump);rows.appendChild(row);
 }
 for(const [id,key] of [['presetOriginal','original'],['presetLater','later'],['presetStagger','stagger']])$(id).addEventListener('click',()=>{playing=false;applyDeaths(DEATH_PRESETS[key]);$('noteBanner').textContent='已应用「'+$(id).textContent+'」；事件年龄可继续单独微调。';sync();});
 $('copyConfig').addEventListener('click',async()=>{const payload=JSON.stringify({version:'death-timing-v1',ageReference:'protagonist',deaths:deathMap()},null,2);
 try{await navigator.clipboard.writeText(payload);$('noteBanner').textContent='已复制六人升星年龄 JSON，可发给我进行最终冻结。';}catch(e){$('noteBanner').textContent='复制权限被拒绝；当前参数：'+JSON.stringify(deathMap());}});
 let stored=null;try{stored=JSON.parse(localStorage.getItem(DEATH_STORE)||'null');}catch(e){}
 applyDeaths(stored&&typeof stored==='object'?stored:DEATH_PRESETS.original,{persist:false});
}

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v)),ease=t=>{t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);};
const lerp=(a,b,t)=>a+(b-a)*t;
function hexRgba(hex,a){let v=hex.slice(1);return `rgba(${parseInt(v.slice(0,2),16)},${parseInt(v.slice(2,4),16)},${parseInt(v.slice(4,6),16)},${a})`}
function vNoise(a,id){let seed=0;for(let i=0;i<id.length;i++)seed+=id.charCodeAt(i)*(i+1);const amp=({me:3.1,mom:9.2,dad:8.2,gm:5.6,gp:5.4,wife:6.8,son:4.6})[id]??6.5;return amp*(.7*Math.sin(.22*a+seed)+.3*Math.sin(.49*a+seed*.37))}
function xAt(p,a){
 if(p.birth){
   // Continuous independence: born near parents, then 56 logical units
   // to the right of Me from Me's age 60 onward (no sudden position jump).
   const me=people.find(q=>q.id==='me');
   // The grown child remains independent even when Me begins to drift away.
   const parentX=xAtBeforeExit(me,a);
   // Me/Partner stable spacing is about 28 units; independent child settles at twice that distance.
   const INDEPENDENT_CHILD_SPACING=2*28;
   const separation=-18+(INDEPENDENT_CHILD_SPACING+18)*ease((a-p.start)/(60-p.start));
   return parentX+separation;
 }
 let x=p.base??p.target;
 if(p.side){let startX=p.side==='left'?-65:W+65;let t=ease((a-p.start)/(p.enterDuration||2));x=lerp(startX,p.target,t);
 // The arc bows gently, but endpoints are tangent to vertical companionship.
 x+=8*Math.sin(Math.PI*clamp((a-p.start)/(p.enterDuration||2),0,1))**2*(p.side==='left'?-1:1);
 }
 x+=vNoise(a,p.id)*(p.side?.34*ease((a-p.start-(p.enterDuration||2))/1.1):1);
 if(p.death!=null && PREP_OFFSETS[p.id]!=null){
   // A person first moves away from the family along the same age horizon,
   // with zero velocity at the departure point: one continuous physical trail.
   const duration=Math.min(PREP_DURATION,Math.max(.8,(p.death-p.start)*.35));
   const u=ease((a-(p.death-duration))/duration);
   x+=PREP_OFFSETS[p.id]*u;
 }
 if(Number.isFinite(p.exit)&&a>=p.exit){let t=ease((a-p.exit)/p.exitDuration);let finalX=p.exitSide==='left'?-85:W+85;let startx=Number.isFinite(p.exit)?xAtBeforeExit(p,p.exit):x;x=lerp(startx,finalX,t)+9*Math.sin(Math.PI*clamp((a-p.exit)/p.exitDuration,0,1))**2;}
 return x;
}
function xAtBeforeExit(p,a){ // no recursion; same entrance and companionship rule
 let x=p.base??p.target;if(p.side){let u=ease((a-p.start)/(p.enterDuration||2));x=lerp(p.side==='left'?-65:W+65,p.target,u)+8*Math.sin(Math.PI*clamp((a-p.start)/(p.enterDuration||2),0,1))**2*(p.side==='left'?-1:1)}
 x+=vNoise(a,p.id)*(p.side?.34*ease((a-p.start-(p.enterDuration||2))/1.1):1);return x;
}
function lastRealityAge(p){return p.death!=null?p.death:p.exit!=null?p.exit+p.exitDuration:END}
function active(p,a){return a>=p.start&&a<=lastRealityAge(p)}
let seed=42;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
// Quiet celestial environment: a prerendered, full-frame deep-space layer.
// Distant stars are far dimmer and much smaller than any relationship node;
// the diagonal dust lane is atmospheric, not another narrative object.
const SKY_TEXTURE=document.createElement('canvas');SKY_TEXTURE.width=W*2;SKY_TEXTURE.height=H*2;
const sk=SKY_TEXTURE.getContext('2d');sk.setTransform(2,0,0,2,0,0);
function paintQuietSky(){
 sk.fillStyle='#030915';sk.fillRect(0,0,W,H);
 const base=sk.createRadialGradient(320,270,18,230,350,680);
 base.addColorStop(0,'#0c1827');base.addColorStop(.55,'#070f1e');base.addColorStop(1,'#030813');
 sk.fillStyle=base;sk.fillRect(0,0,W,H);
 function cloud(x,y,rx,ry,alpha,rotation){
  sk.save();sk.translate(x,y);sk.rotate(rotation);sk.scale(rx,ry);
  const g=sk.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,`rgba(89,118,150,${alpha})`);
  g.addColorStop(.44,`rgba(55,89,126,${alpha*.42})`);
  g.addColorStop(1,'rgba(28,56,92,0)');
  sk.fillStyle=g;sk.fillRect(-1,-1,2,2);sk.restore();
 }
 // Diffuse, barely-visible band crossing the entire sky.
 cloud(382,73,180,280,.115,-.40);
 cloud(335,242,178,300,.095,-.38);
 cloud(257,449,140,310,.078,-.42);
 cloud(164,686,125,245,.050,-.37);
 cloud(427,470,102,280,.048,-.30);
 let state=731413;
 const R=()=>{state=(1664525*state+1013904223)>>>0;return state/4294967296;};
 function dust(x,y,r,opacity){
  sk.fillStyle=`rgba(190,211,236,${opacity})`;
  sk.beginPath();sk.arc(x,y,r,0,TWO);sk.fill();
 }
 // Fine, uniform night-sky points: never as bright as a relationship light.
 for(let i=0;i<410;i++) dust(R()*W,R()*H,.18+R()*.36,.06+R()*.11);
 // A denser, soft Milky Way dust field, too faint to read as individual characters.
 for(let i=0;i<710;i++){
  const y=R()*H;
  const x=438-.40*y+(R()+R()+R()-1.5)*116;
  if(x<0||x>W)continue;
  dust(x,y,.14+R()*.25,.033+R()*.063);
 }
